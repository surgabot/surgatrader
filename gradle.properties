# Gunakan JDK 21 LTS resmi Android Studio
org.gradle.java.home=C:\\Program Files\\Android\\openjdk\\jdk-21.0.8

# Alokasi memori JVM optimal
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Konfigurasi worker
org.gradle.parallel=false
org.gradle.workers.max=2

# Batas alokasi RAM untuk Kotlin compiler
kotlin.daemon.jvm.options=-Xmx1024m

# Konfigurasi AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Caching
org.gradle.caching=true
